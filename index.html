<title>Mandi Titans XI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:linear-gradient(90deg,#ff9800,#ff5722);
padding:20px;
text-align:center;
}

header h1{
font-size:38px;
}

header p{
margin-top:8px;
font-size:18px;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h2{
font-size:40px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#ddd;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 30px;
background:#ff9800;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.players{
padding:40px 20px;
text-align:center;
}

.players h2{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.card{
background:#222;
padding:20px;
border-radius:12px;
}

.card img{
width:100%;
border-radius:10px;
}

footer{
background:#000;
padding:20px;
text-align:center;
margin-top:40px;
}
</style>
